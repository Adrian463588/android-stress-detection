; Verbatim+ integration configuration, 2026-10-06. Upstream eGeMAPSv02
; components are unchanged. Output is utterance means of LLDs, NOT the
; full eGeMAPS 88-functionals vector or a trained arousal classifier.
[componentInstances:cComponentManager]
instance[dataMemory].type=cDataMemory
instance[source].type=cExternalSource
instance[lldconcat].type=cVectorConcat
instance[sink].type=cExternalSink
printLevelStats=0

[source:cExternalSource]
writer.dmLevel=wave
period=0.0000625
fieldNames=pcm
fieldSizes=1
blocksize=320000
buffersize=320000

\{config/gemaps/v01b/GeMAPSv01b_core.lld.conf.inc}
\{config/egemaps/v02/eGeMAPSv02_core.lld.conf.inc}

; Keep bounded LLD buffers for the observed maximum 20-second utterance.
; Spectral and pitch paths have different boundary latencies; the shorter
; observed stream determines the joined output, without padded frames.
[egemapsv02_smoE:cContourSmoother]
writer.levelconf.nT=2005

[egemapsv02_smoFnz:cContourSmoother]
writer.levelconf.nT=2005

[lldconcat:cVectorConcat]
reader.dmLevel=egemapsv02_lldsetE_smo;egemapsv02_lldsetF_smo
writer.dmLevel=lld
includeSingleElementFields=1

[sink:cExternalSink]
reader.dmLevel=lld
