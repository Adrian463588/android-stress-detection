import groovy.json.JsonOutput
import java.security.MessageDigest

plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.stressdetector.inference"
    compileSdk 34

    defaultConfig {
        minSdk 26
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures { buildConfig true }
    flavorDimensions "evidence"
    productFlavors {
        production {
            dimension "evidence"
            buildConfigField "boolean", "RESEARCH_MODEL_MODE", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
    sourceSets {
        production.assets.srcDir("$buildDir/generated/inferenceAssets")
        androidTest.assets.srcDirs = [
            "../../tests/fixtures/android_parity",
            "$buildDir/generated/candidateInferenceAssets",
        ]
