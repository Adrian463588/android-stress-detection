name: Android CI & Hardening Verification

on:
  push:
    branches:
      - main
      - 'android-devsecops-*'
      - 'codex/*'
  pull_request:
    branches:
      - main
      - 'android-devsecops-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Unit Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python for RAG contract verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          packages: 'platform-tools cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (Production Release)
        run: ./gradlew :app:testProductionReleaseUnitTest --no-daemon --stacktrace

      - name: Run Android Lint (Production Release)
        run: ./gradlew :app:lintVitalProductionRelease --no-daemon

      - name: Assemble Production Release APK
        run: ./gradlew :app:assembleProductionRelease --no-daemon

      - name: Verify APK Output
        run: |
          apk_path="app/build/outputs/apk/production/release/app-production-release.apk"
          if [ -f "$apk_path" ]; then
            echo "Release APK built successfully: $(ls -lh "$apk_path")"
            sha256sum "$apk_path"
          else
            echo "::error::Release APK not found at $apk_path"
            exit 1
          fi

      - name: Upload Production Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-production-release-apk
          path: app/build/outputs/apk/production/release/app-production-release.apk
          retention-days: 14
