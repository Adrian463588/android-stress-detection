name: Publication safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete history without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check current source publication policy
        run: |
          python3 -m unittest discover -s scripts -p 'test_publication_safety.py'
          python3 scripts/check_publication_safety.py --worktree

      - name: Scan all reachable Git history for credentials
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/${archive}" \
            --output "${archive}"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "${archive}" | sha256sum --check --status
          tar -xzf "${archive}" gitleaks
          chmod +x gitleaks
          if ! ./gitleaks git --redact --no-banner --log-opts=--all --timeout=120 . \
            > "${RUNNER_TEMP}/gitleaks-output.log" 2>&1; then
            echo '::error::Secret scan failed or found a potential secret. Detailed output is intentionally suppressed.'
            exit 1
          fi
