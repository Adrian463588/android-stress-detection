plugins {
    id "com.android.application" version "8.13.2" apply false
    id "com.android.library" version "8.13.2" apply false
    id "org.jetbrains.kotlin.android" version "2.3.0" apply false
    id "org.jetbrains.kotlin.jvm" version "2.3.0" apply false
    id "com.google.devtools.ksp" version "2.3.0" apply false
    id "org.jetbrains.kotlin.plugin.compose" version "2.3.0" apply false
    id "io.gitlab.arturbosch.detekt" version "1.23.8" apply false
    id "org.jlleitschuh.gradle.ktlint" version "14.2.0" apply false
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

def maintainedModules = [":shared", ":inference", ":app", ":wear"] as Set

subprojects { subproject ->
    if (subproject.path in maintainedModules) {
        apply plugin: "io.gitlab.arturbosch.detekt"
        apply plugin: "org.jlleitschuh.gradle.ktlint"

        detekt {
            buildUponDefaultConfig = true
            config.setFrom(rootProject.files("config/detekt.yml"))
            allRules = false
            ignoreFailures = false
            parallel = true
            basePath = rootProject.projectDir.path
            def moduleBaseline = subproject.file("detekt-baseline.xml")
            if (moduleBaseline.isFile()) {
                baseline = moduleBaseline
            }
        }

        tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach { detektTask ->
            def moduleBaseline = subproject.file("detekt-baseline.xml")
            if (moduleBaseline.isFile()) {
                detektTask.baseline.set(moduleBaseline)
            }
        }

        ktlint {
            ignoreFailures = false
            filter {
                exclude("**/build/**")
                exclude("**/generated/**")
            }
        }
    }
}
